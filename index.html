<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f6f6f6;
  --card: #ffffff;
  --primary: #ff3879;
  --secondary: #3d98ff;
  --text-1: #1a1a1a;
  --text-2: #666666;
  --text-3: #999999;
  --border: #eeeeee;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-hover: 0 6px 24px rgba(0,0,0,0.1);
  --radius: 14px;
  --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'Share Tech Mono', 'Courier New', monospace;
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text-1);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 16px 48px;
}

/* ===== 顶部 ===== */
.header {
  position: sticky;
  top: 0;
  background: rgba(246,246,246,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 100;
  padding: 20px 0 14px;
  border-bottom: 1px solid var(--border);
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.brand {
  font-size: 20px;
  font-weight: 900;
  color: var(--primary);
  letter-spacing: 0.5px;
}

.brand span {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--secondary);
  margin-left: 6px;
  font-weight: 400;
}

/* 右上角logo */
.brand-logo {
  height: 42px;
  display: flex;
  align-items: center;
}

.brand-logo img {
  height: 100%;
  width: auto;
  object-fit: contain;
}

/* 搜索 */
.search-box {
  position: relative;
}

.search-box svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  fill: none;
  stroke: var(--text-3);
  stroke-width: 2;
}

.search-box input {
  width: 100%;
  padding: 10px 14px 10px 38px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-1);
  font-family: var(--font-sans);
  font-size: 13px;
  outline: none;
  transition: all 0.25s;
}

.search-box input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(255,56,121,0.1);
}

.search-box input::placeholder { color: var(--text-3); }

.stats {
  display: flex;
  gap: 16px;
  margin-top: 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-3);
}

.stats b { color: var(--primary); font-weight: 700; }

/* ===== 卡片列表 ===== */
.card-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 18px;
}

.blogger-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}

.blogger-card:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-1px);
}

.card-main {
  display: flex;
  gap: 14px;
  padding: 16px;
}

/* 头像区域 */
.avatar-section {
  flex-shrink: 0;
  position: relative;
  width: 76px;
}

.avatar-wrap {
  position: relative;
  width: 76px;
  height: 76px;
}

.avatar {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: 900;
  color: #fff;
  overflow: hidden;
  border: 2px solid var(--card);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.avatar img { width: 100%; height: 100%; object-fit: cover; }

/* 账号属性横幅 - 覆盖在头像底部 */
.attr-badge {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  font-weight: 700;
  padding: 3px 12px;
  border-radius: 20px;
  color: #fff;
  letter-spacing: 0.5px;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  z-index: 2;
}

/* 条幅颜色 - 纯色底 */
.attr-badge.red { background: #e53935; }
.attr-badge.orange { background: #f57c00; }
.attr-badge.yellow { background: #fbc02d; color: #333; }
.attr-badge.pink { background: #ec407a; }
.attr-badge.teal { background: #00acc1; }

/* 信息区 */
.card-info { flex: 1; min-width: 0; }

.name-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 5px;
}

.card-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-1);
}

.card-id {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 7px;
}

.tag {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  font-weight: 500;
}

.tag-pink { background: rgba(255,56,121,0.1); color: var(--primary); }
.tag-blue { background: rgba(61,152,255,0.1); color: var(--secondary); }
.tag-gray { background: #f0f0f0; color: var(--text-2); }

.card-bio {
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.5;
  margin-bottom: 10px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.fans {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-2);
}

.fans b {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-1);
  margin-right: 2px;
}

/* 报价 */
.price-row {
  display: flex;
  gap: 8px;
}

.price-item {
  flex: 1;
  border-radius: 8px;
  padding: 7px 10px;
  border: 1px solid var(--border);
}

.price-item.implant { background: rgba(61,152,255,0.04); border-color: rgba(61,152,255,0.2); }
.price-item.custom { background: rgba(255,56,121,0.04); border-color: rgba(255,56,121,0.2); }

.price-label {
  font-size: 10px;
  color: var(--text-3);
  margin-bottom: 2px;
  font-family: var(--font-mono);
}

.price-value {
  font-size: 14px;
  font-weight: 700;
  font-family: var(--font-mono);
}

.price-item.implant .price-value { color: var(--secondary); }
.price-item.custom .price-value { color: var(--primary); }

/* ===== 展开按钮 ===== */
.expand-btn {
  width: 100%;
  padding: 11px;
  background: transparent;
  border: none;
  border-top: 1px solid var(--border);
  color: var(--primary);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background 0.2s;
}

.expand-btn:hover { background: rgba(255,56,121,0.04); }

.expand-btn svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.5;
  transition: transform 0.3s;
}

.blogger-card.expanded .expand-btn svg { transform: rotate(180deg); }

/* ===== 展开详情 ===== */
.detail-panel {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1);
  background: #fafafa;
  border-top: 1px solid var(--border);
}

.blogger-card.expanded .detail-panel { max-height: 800px; }

.detail-inner { padding: 16px; }

/* 作品网格 */
.works-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}

/* 单个作品居中 */
.works-grid.single {
  grid-template-columns: 1fr;
  max-width: 200px;
  margin-left: auto;
  margin-right: auto;
}

.work-item {
  border-radius: 10px;
  overflow: hidden;
  background: var(--card);
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  transition: all 0.25s;
  cursor: pointer;
  text-decoration: none;
  display: block;
}

.work-item:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}

/* 作品封面 - 竖版 3:4 */
.work-cover {
  position: relative;
  aspect-ratio: 3/4;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.work-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 左上角标签 */
.work-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 3;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
  color: #fff;
  letter-spacing: 0.5px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.work-badge.represent { background: var(--primary); }
.work-badge.commercial { background: var(--secondary); }

/* 播放按钮 */
.play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border: 1.5px solid rgba(255,255,255,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  transition: all 0.25s;
}

.work-item:hover .play-btn {
  background: var(--primary);
  border-color: var(--primary);
  transform: translate(-50%, -50%) scale(1.1);
}

.play-btn svg {
  width: 14px;
  height: 14px;
  fill: #fff;
  margin-left: 2px;
}

/* 底部数据条 */
.work-stats {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 20px 8px 7px;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
  display: flex;
  justify-content: space-between;
  z-index: 2;
}

.work-stat {
  display: flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-mono);
  font-size: 18px;
  color: #fff;
}

.work-stat svg { width: 22px; height: 22px; fill: currentColor; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.6)); }

.work-stat.likes { color: #ff8fb0; }
.work-stat.views { color: #ffffff; text-shadow: 0 0 8px rgba(120,200,255,0.9); }

/* 作品标题 */
.work-title {
  padding: 8px 10px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 无作品提示 */
.no-works-tip {
  text-align: center;
  padding: 20px;
  color: var(--text-3);
  font-size: 12px;
  margin-bottom: 14px;
}

/* 详情按钮 */
.detail-actions {
  display: flex;
  gap: 8px;
}

.detail-btn {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: all 0.25s;
  border: 1px solid;
}

.detail-btn.douyin {
  background: var(--secondary);
  border-color: var(--secondary);
  color: #fff;
}

.detail-btn.douyin:hover {
  background: #2b85ee;
  box-shadow: 0 4px 12px rgba(61,152,255,0.3);
}

.detail-btn.xingtu {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

.detail-btn.xingtu:hover {
  background: #e82568;
  box-shadow: 0 4px 12px rgba(255,56,121,0.3);
}

.detail-btn:disabled {
  background: #e0e0e0;
  border-color: #e0e0e0;
  color: #999;
  cursor: not-allowed;
  box-shadow: none;
}

.detail-btn svg { width: 13px; height: 13px; fill: currentColor; }

/* ===== 空状态 ===== */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-3);
  font-size: 14px;
}

/* ===== 回到顶部 ===== */
.back-top {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--primary);
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  box-shadow: var(--shadow);
  transition: all 0.25s;
}

.back-top:hover {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 16px rgba(255,56,121,0.3);
}

.back-top svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; }

/* ===== 底部 ===== */
.footer {
  text-align: center;
  margin-top: 32px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
  line-height: 1.8;
}

.footer b { color: var(--primary); font-weight: 700; }

/* ===== 响应式 ===== */
@media (max-width: 380px) {
  .app { padding: 0 12px 40px; }
  .card-main { padding: 14px; gap: 10px; }
  .avatar { width: 64px; height: 64px; font-size: 22px; }
  .avatar-section { width: 64px; }
  .avatar-wrap { width: 64px; height: 64px; }
  .card-name { font-size: 15px; }
  .price-value { font-size: 13px; }
}
</style>

// ===== 状态 =====
let expandedId = null;
let filtered = [...bloggers];

// ===== DOM =====
const cardList = document.getElementById('cardList');
const searchInput = document.getElementById('searchInput');
const totalCountEl = document.getElementById('totalCount');
const shownCountEl = document.getElementById('shownCount');
const backTop = document.getElementById('backTop');

// ===== SVG 图标 =====
const icons = {
  play: '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>',
  heart: '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>',
  eye: '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>',
  external: '<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>',
  chevron: '<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>'
};

// ===== 渲染 =====
function render() {
  if (filtered.length === 0) {
    cardList.innerHTML = '<div class="empty">未找到匹配的博主</div>';
    shownCountEl.textContent = '0';
    return;
  }

  let html = '';
  filtered.forEach(function(b) {
    const isExpanded = expandedId === b.id;
    const bWorks = works[b.id] || [];
    const hasWorks = bWorks.length > 0;
    const isSingle = bWorks.length === 1;

    // 标签
    const tagsHtml = b.tags.map(function(t, i) {
      return '<span class="tag tag-' + (b.tagColors[i] || 'gray') + '">' + t + '</span>';
    }).join('');

    // 作品
    let worksHtml = '';
    if (hasWorks) {
      worksHtml = bWorks.map(function(w) {
        const linkStart = w.url ? '<a class="work-item" href="' + w.url + '" target="_blank" rel="noopener">' : '<div class="work-item" style="cursor:default;">';
        const linkEnd = w.url ? '</a>' : '</div>';
        const coverContent = w.coverImg 
          ? '<img src="' + w.coverImg + '" alt="' + w.title + '" loading="lazy">' 
          : '';
        return linkStart +
          '<div class="work-cover"' + (w.coverImg ? '' : ' style="background:' + (w.cover || 'linear-gradient(135deg,#ccc,#999)') + ';"') + '>' +
            coverContent +
            '<span class="work-badge ' + w.type + '">' + w.badgeText + '</span>' +
            '<div class="play-btn">' + icons.play + '</div>' +
            '<div class="work-stats">' +
              '<span class="work-stat likes">' + icons.heart + w.likes + '</span>' +
              '<span class="work-stat views">' + icons.eye + w.views + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="work-title">' + w.title + '</div>' +
        linkEnd;
      }).join('');
    }

    // 按钮
    const douyinBtn = b.douyin
      ? '<a class="detail-btn douyin" href="' + b.douyin + '" target="_blank" rel="noopener">' + icons.external + '抖音主页</a>'
      : '<button class="detail-btn douyin" disabled>' + icons.external + '暂无链接</button>';
    const xingtuBtn = b.xingtu
      ? '<a class="detail-btn xingtu" href="' + b.xingtu + '" target="_blank" rel="noopener">' + icons.external + '星图主页</a>'
      : '<button class="detail-btn xingtu" disabled>' + icons.external + '暂无链接</button>';

    // 头像
    const avatarContent = b.avatarImg 
      ? '<img src="' + b.avatarImg + '" alt="' + b.name + '" loading="lazy">' 
      : b.avatarText;
    const avatarStyle = b.avatarImg ? '' : ' style="background:' + b.avatarGrad + ';"';

    // 账号属性横幅
    const attrBadge = b.accountAttr 
      ? '<div class="attr-badge ' + b.attrColor + '">' + b.accountAttr + '</div>' 
      : '';

    html += '<article class="blogger-card' + (isExpanded ? ' expanded' : '') + '" data-id="' + b.id + '">' +
      '<div class="card-main">' +
        '<div class="avatar-section">' +
          '<div class="avatar-wrap">' +
            '<div class="avatar"' + avatarStyle + '>' + avatarContent + '</div>' +
            attrBadge +
          '</div>' +
        '</div>' +
        '<div class="card-info">' +
          '<div class="name-row">' +
            '<span class="card-name">' + b.name + '</span>' +
            '<span class="card-id">// ' + b.idStr + '</span>' +
          '</div>' +
          '<div class="tags">' + tagsHtml + '</div>' +
          '<div class="card-bio">' + b.bio + '</div>' +
          '<div class="card-meta">' +
            '<span class="fans">粉丝 <b>' + b.fans + '</b>万</span>' +
          '</div>' +
          '<div class="price-row">' +
            '<div class="price-item implant"><div class="price-label">植入视频</div><div class="price-value">¥' + b.implant + '</div></div>' +
            '<div class="price-item custom"><div class="price-label">定制视频</div><div class="price-value">¥' + b.custom + '</div></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<button class="expand-btn" data-toggle="' + b.id + '">' +
        (isExpanded ? '收起详情' : '查看账号详情') + icons.chevron +
      '</button>' +
      '<div class="detail-panel">' +
        '<div class="detail-inner">' +
          (hasWorks 
            ? '<div class="works-grid' + (isSingle ? ' single' : '') + '">' + worksHtml + '</div>'
            : '<div class="no-works-tip">暂无代表作品，点击下方按钮查看主页</div>'
          ) +
          '<div class="detail-actions">' + douyinBtn + xingtuBtn + '</div>' +
        '</div>' +
      '</div>' +
    '</article>';
  });

  cardList.innerHTML = html;
  shownCountEl.textContent = filtered.length;
}

// ===== 事件 =====
cardList.addEventListener('click', function(e) {
  const btn = e.target.closest('[data-toggle]');
  if (btn) {
    const id = parseInt(btn.getAttribute('data-toggle'));
    expandedId = expandedId === id ? null : id;
    render();
    if (expandedId) {
      setTimeout(function() {
        const card = document.querySelector('.blogger-card.expanded');
        if (card) {
          const rect = card.getBoundingClientRect();
          const targetY = window.pageYOffset + rect.top - 60;
          window.scrollTo({ top: targetY, behavior: 'smooth' });
        }
      }, 200);
    }
  }
});

// 搜索
let searchTimer = null;
searchInput.addEventListener('input', function(e) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    const q = e.target.value.trim().toLowerCase();
    expandedId = null;
    if (q === '') {
      filtered = [...bloggers];
    } else {
      filtered = bloggers.filter(function(b) {
        return b.name.toLowerCase().indexOf(q) !== -1 ||
               b.idStr.toLowerCase().indexOf(q) !== -1 ||
               b.tags.some(function(t) { return t.toLowerCase().indexOf(q) !== -1; }) ||
               b.bio.toLowerCase().indexOf(q) !== -1 ||
               (b.accountAttr && b.accountAttr.toLowerCase().indexOf(q) !== -1);
      });
    }
    render();
  }, 250);
});

// 回到顶部
window.addEventListener('scroll', function() {
  backTop.style.display = window.pageYOffset > 400 ? 'flex' : 'none';
});
backTop.addEventListener('click', function() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ESC 收起
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && expandedId) {
    expandedId = null;
    render();
  }
});

// ===== 初始化 =====
totalCountEl.textContent = bloggers.length;
render();
</script>
